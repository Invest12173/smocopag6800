<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบจองห้อง</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }
    form {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      max-width: 480px;
      width: 100%;
      animation: fadeIn 0.5s ease-in-out;
      text-align: center;
    }
    .logo {
      max-width: 120px;
      width: 40%;
      height: auto;
      display: block;
      margin: 0 auto 10px auto;
    }
    h1 {
      color: #004d40;
      font-size: 20px;
      margin-bottom: 10px;
    }
    h2 {
      color: #00695c;
      margin-bottom: 20px;
    }
    label {
      text-align: left;
      font-weight: 600;
      display: block;
      margin-top: 10px;
      color: #37474f;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #bbb;
      border-radius: 8px;
      transition: 0.2s ease-in-out;
      box-sizing: border-box;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #26a69a;
      outline: none;
      box-shadow: 0 0 4px rgba(38,166,154,0.4);
    }
    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 6px;
      justify-content: flex-start;
    }
    .hidden { display: none; }
    button {
      background: #26a69a;
      color: white;
      border: none;
      padding: 12px;
      margin-top: 20px;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s ease-in-out;
    }
    button:hover { background: #00897b; }
    .error {
      color: red;
      font-size: 14px;
      display: none;
      margin-top: 5px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 600px) {
      h1 { font-size: 18px; }
      h2 { font-size: 18px; }
      .logo { max-width: 100px; }
    }
  </style>
</head>
<body>
  <form id="bookingForm">
    <img src="524988221_1194329726067978_6013857574719058270_n.jpg" alt="โลโก้สโมสรนิสิต" class="logo">
    <h1>งานอาคารสถานที่ สโมสรนิสิตวิทยาลัยการเมืองการปกครอง</h1>
    <h2><i class="fa-solid fa-door-open"></i> ฟอร์มจองห้อง</h2>

    <label><i class="fa-solid fa-school"></i> เลือกห้องเรียน</label>
    <select name="classroom" id="classroom" required>
      <option value="">-- เลือกห้อง --</option>
      <option value="225">D-201 ขนาดความจุ 225 ที่นั่ง</option>
      <option value="120">D-202 ขนาดความจุ 120 ที่นั่ง</option>
      <option value="154">D-206 ขนาดความจุ 154 ที่นั่ง</option>
      <option value="70">D-207 ขนาดความจุ 70 ที่นั่ง</option>
      <option value="50">D-211 ขนาดความจุ 50 ที่นั่ง</option>
      <option value="50">D-212 ขนาดความจุ 50 ที่นั่ง</option>
      <option value="70">D-214 ขนาดความจุ 70 ที่นั่ง</option>
      <option value="90">D-218 ขนาดความจุ 90 ที่นั่ง</option>
      <option value="154">D-219 ขนาดความจุ 154 ที่นั่ง</option>
      <option value="154">D-333 ขนาดความจุ 154 ที่นั่ง</option>
      <option value="154">D-334 ขนาดความจุ 154 ที่นั่ง</option>
      <option value="20">D-339 ขนาดความจุ 20 ที่นั่ง</option>
      <option value="20">D-340 ขนาดความจุ 20 ที่นั่ง</option>
      <option value="322">D-402 ขนาดความจุ 322 ที่นั่ง</option>
      <option value="322">D-411 ขนาดความจุ 322 ที่นั่ง</option>
      <option value="50">D-412 ขนาดความจุ 50 ที่นั่ง</option>
      <option value="20">D-414 ขนาดความจุ 20 ที่นั่ง</option>
      <option value="390">D-415 ขนาดความจุ 390 ที่นั่ง</option>
    </select>

    <label><i class="fa-regular fa-calendar"></i> จองตั้งแต่</label>
    <input type="date" name="start_date" required>
    <input type="time" name="start_time" required>
    <label><i class="fa-regular fa-clock"></i> ถึง</label>
    <input type="time" name="end_time" required>

    <label><i class="fa-solid fa-pen"></i> เพื่อใช้สำหรับ</label>
    <input type="text" name="purpose" placeholder="ระบุวัตถุประสงค์" required>

    <label><i class="fa-solid fa-video"></i> ต้องการเจ้าหน้าที่โสต</label>
    <div class="radio-group">
      <label><input type="radio" name="av" value="ต้องการ" required> ต้องการ</label>
      <label><input type="radio" name="av" value="ไม่ต้องการ"> ไม่ต้องการ</label>
    </div>

    <label><i class="fa-solid fa-microphone"></i> ต้องการไมค์ลอยหรือไม่</label>
    <div class="radio-group">
      <label><input type="radio" name="mic" value="ต้องการ" required> ต้องการ</label>
      <label><input type="radio" name="mic" value="ไม่ต้องการ"> ไม่ต้องการ</label>
    </div>

    <div id="micCountDiv" class="hidden">
      <label><i class="fa-solid fa-hashtag"></i> จำนวนไมค์ลอยที่ต้องการ</label>
      <input type="number" name="mic_count" min="1" placeholder="เช่น 2">
    </div>

    <label><i class="fa-solid fa-users"></i> จำนวนผู้เข้าร่วม</label>
    <input type="number" name="participants" id="participants" min="1" required>
    <div id="capacityError" class="error">จำนวนผู้เข้าร่วมเกินความจุของห้อง</div>

    <label><i class="fa-solid fa-user"></i> ผู้ขอใช้</label>
    <input type="text" name="requester" placeholder="ชื่อ-นามสกุล" required>

    <label><i class="fa-solid fa-id-badge"></i> ตำแหน่ง</label>
    <input type="text" name="position" placeholder="ตำแหน่ง" required>

    <label><i class="fa-solid fa-building"></i> คณะ/หน่วยงาน</label>
    <input type="text" name="faculty" placeholder="คณะหรือหน่วยงาน" required>

    <label><i class="fa-solid fa-phone"></i> เบอร์ติดต่อกลับ</label>
    <input type="tel" name="contact" placeholder="เช่น 0812345678" required>

    <label><i class="fa-solid fa-chalkboard-user"></i> ผู้ควบคุม</label>
    <input type="text" name="controller" placeholder="ชื่ออาจารย์/เจ้าหน้าที่ควบคุมการใช้ห้อง" required>

    <label><i class="fa-solid fa-note-sticky"></i> คำขอเพิ่มเติม</label>
    <textarea name="additional" rows="3" placeholder="ระบุความต้องการเพิ่มเติม"></textarea>

    <label><i class="fa-solid fa-file-pdf"></i> แนบเอกสาร (PDF เท่านั้น)</label>
    <input type="file" accept="application/pdf" name="document">

    <button type="submit"><i class="fa-solid fa-paper-plane"></i> ยืนยันการจอง</button>
  </form>

  <script>
    const classroom = document.getElementById('classroom');
    const participants = document.getElementById('participants');
    const error = document.getElementById('capacityError');
    const micRadios = document.querySelectorAll('input[name="mic"]');
    const micCountDiv = document.getElementById('micCountDiv');

    function checkCapacity() {
      const capacity = parseInt(classroom.value);
      const num = parseInt(participants.value);
      if (capacity && num > capacity) {
        error.style.display = 'block';
      } else {
        error.style.display = 'none';
      }
    }

    classroom.addEventListener('change', checkCapacity);
    participants.addEventListener('input', checkCapacity);

    micRadios.forEach(radio => {
      radio.addEventListener('change', () => {
        if (radio.value === 'ต้องการ' && radio.checked) {
          micCountDiv.classList.remove('hidden');
        } else if (radio.value === 'ไม่ต้องการ' && radio.checked) {
          micCountDiv.classList.add('hidden');
        }
      });
    });

    document.getElementById('bookingForm').addEventListener('submit', function(event) {
      event.preventDefault();
      if (error.style.display === 'block') {
        alert('กรุณาแก้ไขจำนวนผู้เข้าร่วมให้ไม่เกินความจุของห้อง');
      } else {
        const formData = new FormData(this);
        const micSelected = formData.get("mic") === "ต้องการ";
        if (micSelected && !formData.get("mic_count")) {
          alert("กรุณาระบุจำนวนไมค์ลอยที่ต้องการ");
          return;
        }
        sessionStorage.setItem('bookingData', JSON.stringify(Object.fromEntries(formData.entries())));
        window.location.href = "success.html";
      }
    });
  </script>
</body>
</html>
